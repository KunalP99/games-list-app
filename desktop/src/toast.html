<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GamesList</title>
  <!-- The same stylesheet as the status screen, so the toast is in the user's
       accent colour and the app's fonts without a second copy of the tokens. -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="toast-body">
  <div class="toast" id="toast">
    <!-- Closes only this window — the question stays pending on the status
         screen, in case this was a misclick rather than an answer. -->
    <button type="button" class="toast-dismiss" id="ask-dismiss" aria-label="Close">&times;</button>

    <!-- The question. Which of the two shapes shows depends on whether the
         executable's name actually resembles a game in the Playing list. -->
    <section id="ask">
      <p class="toast-heading" id="ask-heading">Is this your game?</p>
      <p class="prompt-question">
        <code id="ask-exe"></code>
        <span id="ask-named">
          <span class="toast-arrow" aria-hidden="true">&rarr;</span>
          <strong id="ask-title"></strong>
        </span>
        <span class="toast-help" id="ask-help" hidden>
          Tell GamesList which one and it will log the hours.
        </span>
      </p>
      <div class="prompt-actions">
        <button class="primary" id="ask-yes">Yes</button>
        <button class="ghost" id="ask-no">No</button>
      </div>
      <!-- Linking goes over the network, so it can fail. Saying so beats
           closing as though it had worked. -->
      <p class="toast-error" id="ask-error" hidden></p>
    </section>

    <!-- Shown in place after "No", rather than vanishing without a word. -->
    <section id="said-no" hidden>
      <p class="toast-heading">No problem.</p>
      <p class="prompt-question">
        You can link <code id="no-exe"></code> any time from the GamesList app.
      </p>
      <div class="prompt-actions">
        <button class="ghost" id="no-open">Open GamesList</button>
      </div>
    </section>

    <!-- Shown in place of #ask right after a game is auto-filed for the
         first time — the two never overlap, since one only exists when
         identification failed and the other only right after it succeeded.
         Mirrors #platform-prompt-card in index.html. -->
    <section id="platform-ask" hidden>
      <p class="toast-heading">What platform are you playing <strong id="platform-ask-title"></strong> on?</p>
      <select id="platform-ask-select" class="field"></select>
      <div class="prompt-actions">
        <button class="primary" id="platform-ask-save">Save</button>
      </div>
      <p class="toast-error" id="platform-ask-error" hidden></p>
    </section>

    <!-- Mirrors #resume-prompt-card in index.html — see there for when this
         shows instead of #ask or #platform-ask. -->
    <section id="resume-ask" hidden>
      <p class="toast-heading" id="resume-ask-heading"></p>
      <p class="prompt-question" id="resume-ask-warning">
        If this isn't right, this session's hours won't be tracked.
      </p>
      <div class="prompt-actions">
        <button class="primary" id="resume-ask-yes"></button>
        <button class="primary" id="resume-ask-ambient" hidden>Set to Ambient</button>
        <button class="ghost" id="resume-ask-no">Not now</button>
      </div>
      <p class="toast-error" id="resume-ask-error" hidden></p>
    </section>
  </div>

  <script type="module" src="toast.js"></script>
</body>
</html>
